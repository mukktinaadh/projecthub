<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of a presenter standing beside a large project dashboard">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b53b8"/>
      <stop offset="1" stop-color="#4f63d2"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="760" fill="url(#bg1)"/>

  <!-- soft deco circles -->
  <circle cx="240" cy="140" r="230" fill="#ffffff" opacity="0.04"/>
  <circle cx="1260" cy="620" r="260" fill="#ffffff" opacity="0.05"/>
  <circle cx="120" cy="640" r="150" fill="#ffffff" opacity="0.04"/>

  <!-- floor shadow -->
  <ellipse cx="760" cy="700" rx="430" ry="26" fill="#1e2a78" opacity="0.35"/>

  <!-- presentation board -->
  <rect x="430" y="120" width="640" height="480" rx="24" fill="#f1f5f9"/>
  <rect x="430" y="120" width="640" height="480" rx="24" fill="none" stroke="#dbe3ef" stroke-width="3"/>
  <!-- board legs -->
  <line x1="560" y1="600" x2="500" y2="712" stroke="#d3a15a" stroke-width="14" stroke-linecap="round"/>
  <line x1="940" y1="600" x2="1000" y2="712" stroke="#d3a15a" stroke-width="14" stroke-linecap="round"/>

  <!-- dashboard screen on board -->
  <rect x="500" y="210" width="380" height="270" rx="16" fill="#1f2937"/>
  <rect x="512" y="222" width="356" height="246" rx="10" fill="#f8fafc"/>
  <!-- sidebar lines -->
  <rect x="526" y="240" width="70" height="10" rx="5" fill="#c7d2fe"/>
  <rect x="526" y="262" width="52" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="526" y="280" width="60" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="526" y="298" width="44" height="8" rx="4" fill="#e2e8f0"/>
  <!-- bars -->
  <rect x="640" y="360" width="26" height="80" rx="6" fill="#a5b4fc"/>
  <rect x="678" y="330" width="26" height="110" rx="6" fill="#818cf8"/>
  <rect x="716" y="300" width="26" height="140" rx="6" fill="#6366f1"/>
  <rect x="754" y="272" width="26" height="168" rx="6" fill="#4f46e5"/>
  <!-- trend line -->
  <polyline points="648,340 690,312 728,284 766,254" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="766" cy="254" r="7" fill="#f59e0b"/>
  <!-- text lines -->
  <rect x="640" y="240" width="150" height="12" rx="6" fill="#c7d2fe"/>
  <rect x="640" y="264" width="100" height="9" rx="4" fill="#e2e8f0"/>

  <!-- checklist on board -->
  <circle cx="920" cy="240" r="9" fill="#d97706"/>
  <rect x="942" y="234" width="96" height="12" rx="6" fill="#cbd5e1"/>
  <circle cx="920" cy="290" r="9" fill="#d97706"/>
  <rect x="942" y="284" width="96" height="12" rx="6" fill="#cbd5e1"/>
  <circle cx="920" cy="340" r="9" fill="#d97706"/>
  <rect x="942" y="334" width="96" height="12" rx="6" fill="#cbd5e1"/>
  <circle cx="920" cy="390" r="9" fill="#d97706"/>
  <rect x="942" y="384" width="96" height="12" rx="6" fill="#cbd5e1"/>
  <circle cx="920" cy="440" r="9" fill="#d97706"/>
  <rect x="942" y="434" width="96" height="12" rx="6" fill="#cbd5e1"/>

  <!-- presenter -->
  <g>
    <!-- legs -->
    <rect x="316" y="520" width="26" height="170" rx="12" fill="#2b3445"/>
    <rect x="350" y="520" width="26" height="170" rx="12" fill="#2b3445"/>
    <ellipse cx="326" cy="700" rx="22" ry="10" fill="#3f4757"/>
    <ellipse cx="366" cy="700" rx="22" ry="10" fill="#3f4757"/>
    <!-- jacket -->
    <path d="M296 340 Q346 316 396 340 L404 530 Q346 548 288 530 Z" fill="#3a4356"/>
    <!-- shirt -->
    <path d="M330 334 L346 336 L362 334 L360 470 L332 470 Z" fill="#10b981"/>
    <!-- pointing arm -->
    <path d="M392 366 Q440 380 486 396" fill="none" stroke="#3a4356" stroke-width="22" stroke-linecap="round"/>
    <circle cx="492" cy="398" r="11" fill="#8d5524"/>
    <!-- other arm -->
    <path d="M300 380 Q282 430 296 470" fill="none" stroke="#3a4356" stroke-width="22" stroke-linecap="round"/>
    <circle cx="297" cy="476" r="11" fill="#8d5524"/>
    <!-- head -->
    <circle cx="346" cy="284" r="38" fill="#8d5524"/>
    <!-- hair -->
    <path d="M310 272 Q314 236 350 238 Q386 240 382 274 Q380 254 346 252 Q318 254 310 272 Z" fill="#1f2430"/>
    <!-- smile -->
    <path d="M334 300 Q346 312 360 300" fill="none" stroke="#1f2430" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- floating accents -->
  <g opacity="0.9">
    <rect x="1140" y="180" width="120" height="76" rx="14" fill="#ffffff" opacity="0.14"/>
    <rect x="1158" y="200" width="60" height="10" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="1158" y="220" width="84" height="10" rx="5" fill="#ffffff" opacity="0.3"/>
  </g>
  <g opacity="0.9">
    <rect x="150" y="300" width="110" height="70" rx="14" fill="#ffffff" opacity="0.12"/>
    <path d="M178 352 l22 -26 16 12 26 -32" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  </g>
</svg>
