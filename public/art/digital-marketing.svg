<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Abstract illustration of a marketing funnel with social metrics">
  <rect width="800" height="500" fill="#fff1f2"/>
  <circle cx="660" cy="110" r="150" fill="#e11d48" opacity="0.08"/>
  <circle cx="130" cy="420" r="170" fill="#e11d48" opacity="0.07"/>

  <!-- funnel -->
  <rect x="150" y="130" width="340" height="60" rx="12" fill="#fda4af"/>
  <rect x="190" y="210" width="260" height="60" rx="12" fill="#fb7185"/>
  <rect x="230" y="290" width="180" height="60" rx="12" fill="#f43f5e"/>
  <rect x="270" y="370" width="100" height="60" rx="12" fill="#e11d48"/>

  <!-- funnel labels -->
  <rect x="250" y="154" width="140" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
  <rect x="280" y="234" width="80" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
  <rect x="300" y="314" width="40" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
