  <rect x="590" y="180" width="90" height="0" fill="none"/>

  <!-- engagement chip -->
  <rect x="560" y="290" width="150" height="110" rx="16" fill="#e11d48"/>
  <path d="M596 336c0-6 5-11 11-11 4 0 7 2 9 5 2-3 5-5 9-5 6 0 11 5 11 11 0 12-20 22-20 22s-20-10-20-22z" fill="#ffffff"/>
  <rect x="648" y="332" width="44" height="10" rx="5" fill="#fecdd3"/>
  <rect x="648" y="354" width="32" height="10" rx="5" fill="#fda4af"/>
