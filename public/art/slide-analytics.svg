<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of analytics dashboards on a laptop and phone">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c5f63"/>
      <stop offset="1" stop-color="#3b757a"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="760" fill="url(#bg2)"/>

  <!-- gears and clock -->
  <g opacity="0.16" stroke="#ffffff" fill="none" stroke-width="10">
    <circle cx="250" cy="600" r="60"/>
    <circle cx="250" cy="600" r="24"/>
    <circle cx="1220" cy="150" r="46"/>
    <circle cx="1220" cy="150" r="18"/>
  </g>
  <g>
    <circle cx="360" cy="150" r="70" fill="#e5b83c"/>
    <circle cx="360" cy="150" r="56" fill="#f8fafc"/>
    <line x1="360" y1="150" x2="360" y2="112" stroke="#1f2937" stroke-width="8" stroke-linecap="round"/>
    <line x1="360" y1="150" x2="392" y2="162" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
    <circle cx="360" cy="150" r="8" fill="#1f2937"/>
  </g>

  <!-- floor shadow -->
  <ellipse cx="720" cy="706" rx="470" ry="26" fill="#17444a" opacity="0.4"/>

  <!-- laptop -->
  <g>
    <rect x="430" y="210" width="520" height="330" rx="18" fill="#1f2937"/>
    <rect x="446" y="226" width="488" height="298" rx="10" fill="#f8fafc"/>
    <!-- bar chart -->
    <rect x="490" y="380" width="42" height="110" rx="8" fill="#94a3b8"/>
    <rect x="548" y="340" width="42" height="150" rx="8" fill="#e11d48"/>
    <rect x="606" y="310" width="42" height="180" rx="8" fill="#e5b83c"/>
    <rect x="664" y="360" width="42" height="130" rx="8" fill="#94a3b8"/>
    <!-- donut chart -->
    <g transform="translate(790 400)">
      <circle r="60" fill="#e11d48"/>
      <path d="M0 -60 A60 60 0 0 1 52 30 L0 0 Z" fill="#f8fafc"/>
      <path d="M52 30 A60 60 0 0 1 0 60 L0 0 Z" fill="#e5b83c" opacity="0.9"/>
      <circle r="30" fill="#f8fafc"/>
    </g>
    <!-- top text lines -->
    <rect x="490" y="250" width="200" height="14" rx="7" fill="#cbd5e1"/>
    <rect x="490" y="278" width="140" height="10" rx="5" fill="#e2e8f0"/>
    <!-- laptop base -->
    <rect x="380" y="540" width="620" height="26" rx="13" fill="#334155"/>
  </g>

  <!-- phone -->
  <g>
    <rect x="210" y="330" width="130" height="250" rx="22" fill="#1f2937"/>
    <rect x="222" y="350" width="106" height="200" rx="12" fill="#f8fafc"/>
    <g transform="translate(275 450)">
      <path d="M0 -44 A44 44 0 0 1 38 22 L0 0 Z" fill="#e11d48"/>
      <path d="M38 22 A44 44 0 1 1 -30 -32 L0 0 Z" fill="#94a3b8"/>
    </g>
    <rect x="262" y="566" width="26" height="4" rx="2" fill="#334155"/>
  </g>

  <!-- documents -->
  <g>
    <rect x="570" y="590" width="230" height="130" rx="10" fill="#f8fafc" transform="rotate(-2 685 655)"/>
    <polyline points="600,690 640,660 670,676 710,640 750,656" fill="none" stroke="#3b757a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-2 685 655)"/>
    <circle cx="640" cy="660" r="7" fill="#e11d48" transform="rotate(-2 685 655)"/>
    <circle cx="710" cy="640" r="7" fill="#e11d48" transform="rotate(-2 685 655)"/>
  </g>
  <g>
    <rect x="1040" y="380" width="150" height="190" rx="10" fill="#1f2937"/>
    <rect x="1052" y="392" width="126" height="166" rx="6" fill="#f8fafc"/>
    <g fill="#3b757a">
      <circle cx="1080" cy="440" r="16"/>
      <circle cx="1120" cy="470" r="20"/>
      <circle cx="1085" cy="505" r="13"/>
    </g>
    <g fill="#94a3b8">
      <circle cx="1140" cy="430" r="12"/>
      <circle cx="1150" cy="500" r="10"/>
    </g>
  </g>

  <!-- magnifier -->
  <g>
    <line x1="960" y1="500" x2="1050" y2="600" stroke="#334155" stroke-width="22" stroke-linecap="round"/>
    <circle cx="920" cy="450" r="76" fill="#ffffff" opacity="0.14"/>
    <circle cx="920" cy="450" r="76" fill="none" stroke="#e2e8f0" stroke-width="14"/>
  </g>
</svg>
