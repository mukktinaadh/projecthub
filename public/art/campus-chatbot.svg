<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Abstract illustration of chat bubbles with a friendly robot">
  <rect width="800" height="500" fill="#f5f3ff"/>
  <circle cx="140" cy="100" r="150" fill="#7c3aed" opacity="0.08"/>
  <circle cx="680" cy="420" r="190" fill="#7c3aed" opacity="0.07"/>

  <!-- robot bubble -->
  <rect x="170" y="110" width="230" height="170" rx="24" fill="#7c3aed"/>
  <path d="M215 280l-10 36 44-36z" fill="#7c3aed"/>
  <line x1="285" y1="110" x2="285" y2="82" stroke="#7c3aed" stroke-width="6"/>
  <circle cx="285" cy="72" r="10" fill="#a78bfa"/>
  <circle cx="240" cy="180" r="16" fill="#ffffff"/>
  <circle cx="330" cy="180" r="16" fill="#ffffff"/>
  <circle cx="240" cy="180" r="7" fill="#312e81"/>
  <circle cx="330" cy="180" r="7" fill="#312e81"/>
  <path d="M255 220q30 22 60 0" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- user bubble -->
  <rect x="430" y="170" width="200" height="90" rx="24" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <path d="M600 260l12 34-46-34z" fill="#ffffff"/>
  <rect x="456" y="198" width="130" height="12" rx="6" fill="#ddd6fe"/>
  <rect x="456" y="224" width="88" height="12" rx="6" fill="#ede9fe"/>

  <!-- typing bubble -->
  <rect x="200" y="330" width="140" height="64" rx="20" fill="#ede9fe"/>
  <circle cx="240" cy="362" r="8" fill="#7c3aed"/>
  <circle cx="270" cy="362" r="8" fill="#a78bfa"/>
  <circle cx="300" cy="362" r="8" fill="#ddd6fe"/>

  <!-- spark chip -->
  <circle cx="620" cy="120" r="36" fill="#f59e0b"/>
  <path d="M620 102l6 14 15 2-11 11 3 15-13-8-13 8 3-15-11-11 15-2z" fill="#ffffff"/>
</svg>
