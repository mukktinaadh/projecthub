<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of project documents with checkmarks and report pages">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#6d5fe8"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="760" fill="url(#bg3)"/>

  <!-- soft deco -->
  <circle cx="180" cy="160" r="200" fill="#ffffff" opacity="0.05"/>
  <circle cx="1300" cy="620" r="240" fill="#ffffff" opacity="0.05"/>

  <!-- floor shadow -->
  <ellipse cx="720" cy="708" rx="440" ry="24" fill="#2c2a8f" opacity="0.45"/>

  <!-- big document with checklist -->
  <g>
    <rect x="470" y="140" width="360" height="480" rx="20" fill="#f8fafc"/>
    <rect x="470" y="140" width="360" height="70" rx="20" fill="#e0e7ff"/>
    <rect x="470" y="186" width="360" height="24" fill="#e0e7ff"/>
    <circle cx="516" cy="175" r="9" fill="#f87171"/>
    <circle cx="544" cy="175" r="9" fill="#fbbf24"/>
    <circle cx="572" cy="175" r="9" fill="#34d399"/>
    <rect x="600" y="163" width="180" height="22" rx="11" fill="#ffffff"/>

    <!-- checklist rows -->
    <g>
      <rect x="510" y="250" width="46" height="46" rx="12" fill="#4f46e5"/>
      <path d="M522 273 l10 10 20 -22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="578" y="262" width="200" height="14" rx="7" fill="#c7d2fe"/>
      <rect x="578" y="284" width="140" height="10" rx="5" fill="#e2e8f0"/>
    </g>
    <g>
      <rect x="510" y="330" width="46" height="46" rx="12" fill="#4f46e5"/>
      <path d="M522 353 l10 10 20 -22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="578" y="342" width="180" height="14" rx="7" fill="#c7d2fe"/>
      <rect x="578" y="364" width="120" height="10" rx="5" fill="#e2e8f0"/>
    </g>
    <g>
      <rect x="510" y="410" width="46" height="46" rx="12" fill="#4f46e5"/>
      <path d="M522 433 l10 10 20 -22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="578" y="422" width="160" height="14" rx="7" fill="#c7d2fe"/>
      <rect x="578" y="444" width="130" height="10" rx="5" fill="#e2e8f0"/>
    </g>
    <!-- abstract chart -->
    <polyline points="510,560 560,530 610,545 660,505 710,515" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="710" cy="515" r="8" fill="#f59e0b"/>
  </g>

  <!-- report page left -->
  <g transform="rotate(-6 280 430)">
    <rect x="170" y="270" width="220" height="300" rx="16" fill="#ffffff" opacity="0.96"/>
    <rect x="200" y="310" width="120" height="14" rx="7" fill="#c7d2fe"/>
    <rect x="200" y="340" width="160" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="200" y="362" width="140" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="200" y="384" width="150" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="200" y="430" width="60" height="90" rx="8" fill="#a5b4fc"/>
    <rect x="275" y="452" width="60" height="68" rx="8" fill="#818cf8"/>
  </g>

  <!-- certificate page right -->
  <g transform="rotate(5 1160 420)">
    <rect x="1050" y="270" width="220" height="300" rx="16" fill="#ffffff" opacity="0.96"/>
    <circle cx="1160" cy="360" r="46" fill="#eef2ff"/>
    <path d="M1138 360 l16 16 30 -34" fill="none" stroke="#10b981" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1090" y="440" width="140" height="12" rx="6" fill="#c7d2fe"/>
    <rect x="1110" y="464" width="100" height="10" rx="5" fill="#e2e8f0"/>
    <!-- ribbon -->
    <circle cx="1160" cy="510" r="18" fill="#f59e0b"/>
    <path d="M1150 522 l-8 34 18 -12 18 12 -8 -34" fill="#d97706"/>
  </g>

  <!-- floating chips -->
  <g opacity="0.9">
    <rect x="120" y="600" width="130" height="70" rx="14" fill="#ffffff" opacity="0.14"/>
    <rect x="140" y="620" width="70" height="10" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="140" y="640" width="90" height="10" rx="5" fill="#ffffff" opacity="0.3"/>
  </g>
  <g opacity="0.9">
    <rect x="1190" y="140" width="120" height="76" rx="14" fill="#ffffff" opacity="0.14"/>
    <path d="M1215 190 l24 -26 18 12 28 -30" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  </g>
</svg>
