  <circle cx="246" cy="146" r="7" fill="#fbbf24"/>
  <circle cx="270" cy="146" r="7" fill="#34d399"/>
  <rect x="300" y="134" width="280" height="24" rx="12" fill="#ffffff"/>

  <!-- sidebar -->
  <rect x="214" y="196" width="90" height="230" rx="12" fill="#eef2ff"/>
  <rect x="228" y="216" width="62" height="12" rx="6" fill="#a5b4fc"/>
  <rect x="228" y="246" width="62" height="12" rx="6" fill="#c7d2fe"/>
  <rect x="228" y="276" width="62" height="12" rx="6" fill="#c7d2fe"/>
  <rect x="228" y="306" width="62" height="12" rx="6" fill="#c7d2fe"/>
  <rect x="228" y="336" width="62" height="12" rx="6" fill="#c7d2fe"/>

  <!-- chart bars -->
  <rect x="336" y="330" width="30" height="70" rx="8" fill="#a5b4fc"/>
