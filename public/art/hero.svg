<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Abstract illustration of a project dashboard with charts and code">
  <rect width="800" height="600" fill="#eef2ff"/>
  <circle cx="660" cy="110" r="170" fill="#4f46e5" opacity="0.08"/>
  <circle cx="110" cy="500" r="210" fill="#4f46e5" opacity="0.07"/>
