<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Abstract illustration of warehouse boxes with inventory levels">
  <rect width="800" height="500" fill="#fefce8"/>
  <circle cx="650" cy="110" r="150" fill="#ca8a04" opacity="0.08"/>
  <circle cx="140" cy="420" r="170" fill="#ca8a04" opacity="0.07"/>

  <!-- shelf -->
  <rect x="150" y="130" width="360" height="280" rx="16" fill="#ffffff" stroke="#fde047" stroke-width="2"/>
  <rect x="150" y="130" width="360" height="52" rx="16" fill="#fef9c3"/>
  <rect x="150" y="162" width="360" height="20" fill="#fef9c3"/>
  <rect x="178" y="146" width="130" height="14" rx="7" fill="#eab308"/>

  <!-- boxes on shelf -->
  <g>
    <rect x="180" y="210" width="80" height="70" rx="8" fill="#eab308"/>
    <rect x="210" y="210" width="20" height="70" fill="#facc15"/>
    <rect x="280" y="226" width="64" height="54" rx="8" fill="#facc15"/>
    <rect x="306" y="226" width="14" height="54" fill="#fde047"/>
    <rect x="364" y="218" width="72" height="62" rx="8" fill="#eab308"/>
    <rect x="394" y="218" width="18" height="62" fill="#facc15"/>
  </g>
  <rect x="178" y="300" width="304" height="8" rx="4" fill="#fde047"/>
  <g>
    <rect x="190" y="322" width="60" height="60" rx="8" fill="#facc15"/>
    <rect x="216" y="322" width="16" height="60" fill="#fde047"/>
    <rect x="270" y="330" width="76" height="52" rx="8" fill="#eab308"/>
    <rect x="302" y="330" width="18" height="52" fill="#facc15"/>
  </g>
  <rect x="178" y="392" width="304" height="8" rx="4" fill="#fde047"/>

  <!-- stock level card -->
  <rect x="560" y="160" width="150" height="150" rx="16" fill="#ffffff" stroke="#fde047" stroke-width="2"/>
  <rect x="582" y="184" width="90" height="12" rx="6" fill="#fde047"/>
  <rect x="582" y="212" width="106" height="14" rx="7" fill="#fef9c3"/>
  <rect x="582" y="212" width="76" height="14" rx="7" fill="#eab308"/>
  <rect x="582" y="244" width="106" height="14" rx="7" fill="#fef9c3"/>
  <rect x="582" y="244" width="44" height="14" rx="7" fill="#facc15"/>
  <rect x="582" y="276" width="106" height="14" rx="7" fill="#fef9c3"/>
  <rect x="582" y="276" width="92" height="14" rx="7" fill="#facc15"/>

  <!-- low stock alert chip -->
  <circle cx="640" cy="370" r="42" fill="#eab308"/>
  <rect x="634" y="344" width="12" height="34" rx="6" fill="#ffffff"/>
  <circle cx="640" cy="392" r="8" fill="#ffffff"/>
</svg>
