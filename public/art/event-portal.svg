<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Abstract illustration of an event calendar with tickets">
  <rect width="800" height="500" fill="#f5f3ff"/>
  <circle cx="660" cy="100" r="150" fill="#7c3aed" opacity="0.08"/>
  <circle cx="130" cy="430" r="170" fill="#7c3aed" opacity="0.07"/>

  <!-- calendar -->
  <rect x="150" y="120" width="340" height="270" rx="18" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <rect x="150" y="120" width="340" height="60" rx="18" fill="#ede9fe"/>
  <rect x="150" y="160" width="320" height="20" fill="#ede9fe"/>
  <rect x="320" y="96" width="24" height="40" rx="8" fill="#7c3aed"/>
  <rect x="296" y="96" width="24" height="40" rx="8" fill="#a78bfa"/>
  <rect x="178" y="146" width="110" height="14" rx="7" fill="#8b5cf6"/>

  <!-- date cells -->
  <g fill="#f5f3ff">
    <rect x="178" y="204" width="60" height="44" rx="10"/>
    <rect x="250" y="204" width="60" height="44" rx="10"/>
    <rect x="322" y="204" width="60" height="44" rx="10"/>
    <rect x="394" y="204" width="60" height="44" rx="10"/>
    <rect x="178" y="260" width="60" height="44" rx="10"/>
    <rect x="250" y="260" width="60" height="44" rx="10"/>
    <rect x="322" y="260" width="60" height="44" rx="10"/>
    <rect x="394" y="260" width="60" height="44" rx="10"/>
  </g>
  <rect x="322" y="204" width="60" height="44" rx="10" fill="#8b5cf6"/>
  <rect x="338" y="222" width="28" height="8" rx="4" fill="#ffffff"/>

  <!-- event bars -->
  <rect x="178" y="324" width="200" height="14" rx="7" fill="#ddd6fe"/>
  <rect x="178" y="350" width="150" height="14" rx="7" fill="#ede9fe"/>

  <!-- ticket chip -->
  <g>
    <rect x="560" y="170" width="150" height="90" rx="14" fill="#7c3aed"/>
    <rect x="592" y="206" width="20" height="20" rx="6" fill="#ffffff"/>
    <rect x="626" y="196" width="60" height="12" rx="6" fill="#ddd6fe"/>
    <rect x="626" y="218" width="42" height="12" rx="6" fill="#a78bfa"/>
    <circle cx="560" cy="215" r="8" fill="#f5f3ff"/>
    <circle cx="710" cy="215" r="8" fill="#f5f3ff"/>
  </g>

  <!-- attendees chip -->
  <rect x="540" y="300" width="180" height="70" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <circle cx="572" cy="335" r="16" fill="#8b5cf6"/>
  <circle cx="602" cy="335" r="16" fill="#a78bfa"/>
  <circle cx="632" cy="335" r="16" fill="#c4b5fd"/>
  <rect x="660" y="328" width="44" height="12" rx="6" fill="#ede9fe"/>
</svg>
