<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Abstract illustration of a people analytics report">
  <rect width="800" height="500" fill="#fdf4ff"/>
  <circle cx="650" cy="110" r="150" fill="#a21caf" opacity="0.08"/>
  <circle cx="140" cy="420" r="170" fill="#a21caf" opacity="0.07"/>

  <!-- report card -->
  <rect x="150" y="120" width="360" height="280" rx="18" fill="#ffffff" stroke="#f5d0fe" stroke-width="2"/>
  <rect x="178" y="148" width="150" height="14" rx="7" fill="#e879f9"/>
  <!-- donut chart -->
  <circle cx="250" cy="260" r="60" fill="none" stroke="#f3e8ff" stroke-width="26"/>
  <path d="M250 200a60 60 0 0 1 58 74" fill="none" stroke="#d946ef" stroke-width="26"/>
  <path d="M308 274a60 60 0 0 1-96 34" fill="none" stroke="#e879f9" stroke-width="26"/>
  <!-- legend -->
  <rect x="350" y="210" width="14" height="14" rx="4" fill="#d946ef"/>
  <rect x="374" y="212" width="80" height="10" rx="5" fill="#f3e8ff"/>
  <rect x="350" y="240" width="14" height="14" rx="4" fill="#e879f9"/>
  <rect x="374" y="242" width="100" height="10" rx="5" fill="#f3e8ff"/>
  <rect x="350" y="270" width="14" height="14" rx="4" fill="#f0abfc"/>
  <rect x="374" y="272" width="64" height="10" rx="5" fill="#f3e8ff"/>
  <!-- attrition trend -->
  <polyline points="178,360 220,340 262,348 304,324 346,332 388,308" fill="none" stroke="#a21caf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- people chip -->
  <circle cx="620" cy="220" r="52" fill="#a21caf"/>
  <circle cx="620" cy="206" r="16" fill="#ffffff"/>
  <path d="M594 244c2-16 12-24 26-24s24 8 26 24" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <!-- score chip -->
  <rect x="560" y="300" width="130" height="60" rx="14" fill="#ffffff" stroke="#f5d0fe" stroke-width="2"/>
  <path d="M586 330l10 10 18-20" fill="none" stroke="#a21caf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="624" y="326" width="50" height="10" rx="5" fill="#f3e8ff"/>
</svg>
