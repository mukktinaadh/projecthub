<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Abstract illustration of a finance tracker with wallet and pie chart">
  <rect width="800" height="500" fill="#f0f9ff"/>
  <circle cx="660" cy="110" r="150" fill="#0284c7" opacity="0.08"/>
  <circle cx="130" cy="420" r="170" fill="#0284c7" opacity="0.07"/>

  <!-- pie chart card -->
  <rect x="150" y="120" width="280" height="260" rx="18" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <rect x="178" y="148" width="120" height="13" rx="6.5" fill="#7dd3fc"/>
  <!-- pie -->
  <circle cx="270" cy="270" r="70" fill="#e0f2fe"/>
  <path d="M270 270v-70a70 70 0 0 1 66 92z" fill="#0284c7"/>
  <path d="M270 270l66 22a70 70 0 0 1-104 40z" fill="#38bdf8"/>
  <path d="M270 270l-38 62a70 70 0 0 1-24-100z" fill="#7dd3fc"/>
  <!-- legend -->
  <rect x="348" y="220" width="12" height="12" rx="3" fill="#0284c7"/>
  <rect x="348" y="248" width="12" height="12" rx="3" fill="#38bdf8"/>
  <rect x="348" y="276" width="12" height="12" rx="3" fill="#7dd3fc"/>
  <rect x="370" y="222" width="40" height="8" rx="4" fill="#e0f2fe"/>
  <rect x="370" y="250" width="48" height="8" rx="4" fill="#e0f2fe"/>
  <rect x="370" y="278" width="32" height="8" rx="4" fill="#e0f2fe"/>

  <!-- wallet card -->
  <rect x="490" y="150" width="180" height="130" rx="16" fill="#0369a1"/>
  <rect x="512" y="176" width="70" height="12" rx="6" fill="#7dd3fc"/>
  <rect x="512" y="202" width="130" height="12" rx="6" fill="#bae6fd"/>
  <rect x="512" y="230" width="50" height="26" rx="8" fill="#ffffff" opacity="0.9"/>
  <circle cx="640" cy="215" r="12" fill="#e0f2fe"/>

  <!-- transaction rows -->
  <rect x="470" y="310" width="220" height="120" rx="16" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
  <g fill="#e0f2fe">
    <rect x="494" y="332" width="172" height="20" rx="8"/>
    <rect x="494" y="364" width="140" height="20" rx="8"/>
    <rect x="494" y="396" width="158" height="20" rx="8"/>
  </g>
  <circle cx="505" cy="342" r="5" fill="#0284c7"/>
  <circle cx="505" cy="374" r="5" fill="#38bdf8"/>
  <circle cx="505" cy="406" r="5" fill="#7dd3fc"/>
</svg>
