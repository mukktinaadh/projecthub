<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Abstract illustration of a plant with IoT sensor and signal waves">
  <rect width="800" height="500" fill="#ecfdf5"/>
  <circle cx="660" cy="110" r="160" fill="#059669" opacity="0.08"/>
  <circle cx="120" cy="420" r="180" fill="#059669" opacity="0.07"/>

  <!-- soil -->
  <rect x="140" y="380" width="520" height="26" rx="13" fill="#a7f3d0"/>
  <!-- plant -->
  <path d="M400 380v-120" stroke="#059669" stroke-width="10" stroke-linecap="round"/>
  <path d="M400 300c-40-6-64-32-66-70 38 2 62 26 66 70z" fill="#34d399"/>
  <path d="M400 330c40-6 64-32 66-70-38 2-62 26-66 70z" fill="#059669"/>
  <path d="M400 262c-8-34 4-62 30-80 10 34-2 62-30 80z" fill="#10b981"/>

  <!-- sensor unit -->
  <rect x="366" y="238" width="68" height="48" rx="12" fill="#065f46"/>
  <circle cx="386" cy="262" r="6" fill="#6ee7b7"/>
  <circle cx="414" cy="262" r="6" fill="#34d399"/>
  <!-- signal arcs -->
  <path d="M356 214a60 60 0 0 1 88 0" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  <path d="M338 190a92 92 0 0 1 124 0" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" opacity="0.35"/>

  <!-- data chip card -->
  <rect x="560" y="200" width="150" height="110" rx="16" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
  <rect x="582" y="222" width="80" height="12" rx="6" fill="#a7f3d0"/>
  <rect x="582" y="248" width="106" height="10" rx="5" fill="#d1fae5"/>
  <rect x="582" y="270" width="70" height="10" rx="5" fill="#d1fae5"/>
  <path d="M582 300q12-18 24 0 12-18 24 0 12-18 24 0" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round"/>

  <!-- droplet -->
  <circle cx="200" cy="240" r="40" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
  <path d="M200 216c14 20 20 30 20 40a20 20 0 1 1-40 0c0-10 6-20 20-40z" fill="#059669"/>
</svg>
