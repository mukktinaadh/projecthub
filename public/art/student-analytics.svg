<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Abstract illustration of a machine learning chart with connected nodes">
  <rect width="800" height="500" fill="#eef2ff"/>
  <circle cx="660" cy="90" r="150" fill="#4f46e5" opacity="0.08"/>
  <circle cx="120" cy="430" r="180" fill="#4f46e5" opacity="0.07"/>

  <!-- neural network cluster -->
  <g stroke="#a5b4fc" stroke-width="4">
    <line x1="600" y1="140" x2="668" y2="100"/>
    <line x1="600" y1="140" x2="668" y2="180"/>
    <line x1="600" y1="140" x2="710" y2="140"/>
    <line x1="560" y1="210" x2="600" y2="140"/>
    <line x1="560" y1="210" x2="668" y2="180"/>
  </g>
  <circle cx="600" cy="140" r="18" fill="#4f46e5"/>
  <circle cx="560" cy="210" r="12" fill="#818cf8"/>
  <circle cx="668" cy="100" r="12" fill="#818cf8"/>
  <circle cx="668" cy="180" r="12" fill="#818cf8"/>
  <circle cx="710" cy="140" r="9" fill="#c7d2fe"/>

  <!-- chart card -->
  <rect x="150" y="150" width="360" height="250" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="180" y="180" width="140" height="14" rx="7" fill="#c7d2fe"/>
  <line x1="180" y1="360" x2="470" y2="360" stroke="#e0e7ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="180" y1="300" x2="470" y2="300" stroke="#eef2ff" stroke-width="3"/>
  <line x1="180" y1="240" x2="470" y2="240" stroke="#eef2ff" stroke-width="3"/>
  <polyline points="180,330 250,300 310,265 370,240 450,200" fill="none" stroke="#4f46e5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="180,340 250,322 310,296 370,278 450,246" fill="none" stroke="#f59e0b" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round"/>
  <circle cx="250" cy="300" r="9" fill="#4f46e5"/>
  <circle cx="370" cy="240" r="9" fill="#4f46e5"/>
  <circle cx="450" cy="200" r="11" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>

  <!-- prediction badge -->
  <rect x="470" y="330" width="150" height="58" rx="14" fill="#4f46e5"/>
  <path d="M498 359l10 10 20-22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="538" y="352" width="60" height="10" rx="5" fill="#c7d2fe"/>
</svg>
